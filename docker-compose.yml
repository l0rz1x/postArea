services:
  # 1. Backend Servisi (Express / Node.js)
  server:
    build: ./server
    container_name: postarea-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  # 2. Frontend Servisi (React)
  client:
    build: ./client
    container_name: postarea-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    stdin_open: true
    tty: true
    depends_on:
      - server
    restart: unless-stopped
